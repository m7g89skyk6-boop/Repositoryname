<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张宇航 · 数据分析简历</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0b0710;
            color: #e2d9f0;
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
            padding: 20px 16px 40px;
            min-height: 100vh;
            position: relative;
        }

        /* ===== 梦幻星空背景 ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(ellipse at 20% 50%, #1a1040 0%, #0b0710 70%);
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #c8b6ff, transparent),
                radial-gradient(2px 2px at 40px 70px, #a78bfa, transparent),
                radial-gradient(2px 2px at 50px 160px, #c4b5fd, transparent),
                radial-gradient(2px 2px at 90px 40px, #ddd6fe, transparent),
                radial-gradient(2px 2px at 130px 80px, #a78bfa, transparent),
                radial-gradient(2px 2px at 160px 30px, #c8b6ff, transparent),
                radial-gradient(1px 1px at 200px 120px, #e0d7ff, transparent),
                radial-gradient(1px 1px at 250px 50px, #b9a6f5, transparent),
                radial-gradient(1px 1px at 300px 180px, #d4c8ff, transparent),
                radial-gradient(2px 2px at 350px 90px, #c4b5fd, transparent),
                radial-gradient(2px 2px at 420px 30px, #a78bfa, transparent),
                radial-gradient(1px 1px at 480px 140px, #ddd6fe, transparent),
                radial-gradient(2px 2px at 540px 60px, #c8b6ff, transparent),
                radial-gradient(1px 1px at 600px 200px, #b9a6f5, transparent),
                radial-gradient(2px 2px at 660px 100px, #d4c8ff, transparent),
                radial-gradient(1px 1px at 720px 40px, #c4b5fd, transparent),
                radial-gradient(2px 2px at 780px 160px, #a78bfa, transparent),
                radial-gradient(1px 1px at 840px 70px, #ddd6fe, transparent),
                radial-gradient(2px 2px at 900px 130px, #c8b6ff, transparent),
                radial-gradient(1px 1px at 960px 50px, #b9a6f5, transparent);
            background-size: 200px 200px;
            opacity: 0.6;
            pointer-events: none;
        }

        /* ===== 深色模式（梦幻紫） ===== */
        body.dark {
            background: #0b0710;
            color: #e2d9f0;
        }
        body.dark::before {
            background: radial-gradient(ellipse at 20% 50%, #1a1040 0%, #0b0710 70%);
        }

        /* ===== 亮色模式（梦幻浅紫） ===== */
        body:not(.dark) {
            background: #f4f0ff;
            color: #1e1a2e;
        }
        body:not(.dark)::before {
            background: radial-gradient(ellipse at 20% 50%, #e8e0ff 0%, #f4f0ff 70%);
        }
        body:not(.dark)::after {
            opacity: 0.3;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
            background: rgba(20, 14, 40, 0.65);
            backdrop-filter: blur(14px) saturate(1.2);
            -webkit-backdrop-filter: blur(14px) saturate(1.2);
            border-radius: 40px;
            padding: 28px 34px 36px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(160, 130, 255, 0.10);
            transition: background 0.3s, box-shadow 0.3s;
            position: relative;
            z-index: 1;
        }
        body:not(.dark) .container {
            background: rgba(245, 240, 255, 0.70);
            backdrop-filter: blur(14px) saturate(1.2);
            -webkit-backdrop-filter: blur(14px) saturate(1.2);
            box-shadow: 0 30px 80px rgba(80, 60, 180, 0.10);
            border: 1px solid rgba(160, 130, 255, 0.20);
        }

        @media (max-width: 640px) {
            .container {
                padding: 16px 14px;
                border-radius: 28px;
            }
        }

        /* ===== 导航栏 ===== */
        nav {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 16px;
            border-bottom: 1px solid rgba(160, 130, 255, 0.12);
            margin-bottom: 20px;
        }
        body:not(.dark) nav {
            border-bottom-color: rgba(100, 70, 200, 0.12);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 28px;
            flex-wrap: wrap;
        }
        .nav-name {
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #a78bfa, #7c3aed, #6d28d9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(120, 80, 240, 0.15);
        }
        body:not(.dark) .nav-name {
            background: linear-gradient(135deg, #6d28d9, #7c3aed, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-links {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .nav-links a {
            color: #b8abdd;
            transition: 0.2s;
            border-bottom: 2px solid transparent;
            padding-bottom: 4px;
        }
        body:not(.dark) .nav-links a {
            color: #4a3a6a;
        }
        .nav-links a:hover {
            color: #a78bfa;
            border-bottom-color: #a78bfa;
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .icon-btn {
            background: rgba(160, 130, 255, 0.08);
            border: 1px solid rgba(160, 130, 255, 0.12);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 40px;
            transition: 0.2s;
            color: #c8b6ff;
            backdrop-filter: blur(4px);
        }
        body:not(.dark) .icon-btn {
            color: #4a3a6a;
            background: rgba(100, 70, 200, 0.06);
            border-color: rgba(100, 70, 200, 0.10);
        }
        .icon-btn:hover {
            background: rgba(160, 130, 255, 0.18);
            transform: scale(1.03);
        }
        @media (max-width: 600px) {
            .nav-links {
                display: none;
            }
        }

        /* ===== Hero ===== */
        .hero {
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            padding: 12px 0 24px;
            align-items: center;
        }
        .hero-text {
            flex: 2;
            min-width: 240px;
        }
        .hero-text h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            line-height: 1.2;
            background: linear-gradient(135deg, #e2d9f0, #c8b6ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        body:not(.dark) .hero-text h1 {
            background: linear-gradient(135deg, #2d1b69, #6d28d9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-text .subhead {
            font-size: 1rem;
            color: #b8abdd;
            margin: 6px 0 10px;
            font-weight: 400;
        }
        body:not(.dark) .hero-text .subhead {
            color: #5a4a7a;
        }
        .hero-text p {
            margin: 10px 0 14px;
            color: #cfc5e8;
            max-width: 620px;
        }
        body:not(.dark) .hero-text p {
            color: #3a2a5a;
        }
        .badge-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0 16px;
        }
        .badge {
            background: rgba(160, 130, 255, 0.12);
            border: 1px solid rgba(160, 130, 255, 0.15);
            color: #c8b6ff;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }
        body:not(.dark) .badge {
            background: rgba(100, 70, 200, 0.06);
            border-color: rgba(100, 70, 200, 0.12);
            color: #4a3a6a;
        }
        .badge.primary {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            border-color: transparent;
        }
        body:not(.dark) .badge.primary {
            background: linear-gradient(135deg, #6d28d9, #7c3aed);
            color: white;
        }

        .contact-row {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 28px;
            margin-top: 14px;
        }
        .contact-row a,
        .contact-row span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            color: #a78bfa;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        body:not(.dark) .contact-row a,
        body:not(.dark) .contact-row span {
            color: #6d28d9;
        }
        .contact-row a:hover,
        .contact-row span:hover {
            color: #c8b6ff;
            transform: translateY(-1px);
        }

        .hero-stats {
            flex: 1;
            min-width: 180px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            background: rgba(30, 20, 60, 0.50);
            padding: 22px 18px;
            border-radius: 28px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(160, 130, 255, 0.08);
        }
        body:not(.dark) .hero-stats {
            background: rgba(230, 220, 255, 0.50);
            border-color: rgba(100, 70, 200, 0.08);
        }
        .stat-item {
            text-align: center;
        }
        .stat-num {
            font-size: 1.8rem;
            font-weight: 700;
            color: #a78bfa;
            letter-spacing: -0.2px;
            text-shadow: 0 0 30px rgba(120, 80, 240, 0.20);
        }
        body:not(.dark) .stat-num {
            color: #6d28d9;
            text-shadow: 0 0 30px rgba(100, 70, 200, 0.10);
        }
        .stat-label {
            font-size: 0.7rem;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #b8abdd;
        }
        body:not(.dark) .stat-label {
            color: #5a4a7a;
        }

        /* ===== 通用组件 ===== */
        section {
            margin: 32px 0 20px;
        }
        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #d4c8ff;
        }
        body:not(.dark) .section-title {
            color: #2d1b69;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, rgba(160, 130, 255, 0.40), transparent);
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }
        .card {
            background: rgba(30, 20, 60, 0.45);
            backdrop-filter: blur(8px);
            padding: 18px 20px;
            border-radius: 24px;
            transition: all 0.25s ease;
            border: 1px solid rgba(160, 130, 255, 0.06);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }
        body:not(.dark) .card {
            background: rgba(245, 240, 255, 0.60);
            border-color: rgba(100, 70, 200, 0.06);
            box-shadow: 0 4px 20px rgba(80, 60, 180, 0.06);
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(80, 60, 200, 0.20);
            border-color: rgba(160, 130, 255, 0.15);
        }
        body:not(.dark) .card:hover {
            box-shadow: 0 12px 40px rgba(80, 60, 180, 0.10);
            border-color: rgba(100, 70, 200, 0.15);
        }
        .card.highlight-card {
            background: linear-gradient(135deg, rgba(100, 70, 200, 0.15), rgba(80, 50, 180, 0.08));
            border-left: 3px solid #a78bfa;
        }
        body:not(.dark) .card.highlight-card {
            background: linear-gradient(135deg, rgba(100, 70, 200, 0.06), rgba(80, 50, 180, 0.03));
            border-left-color: #6d28d9;
        }

        /* ===== Tabs ===== */
        .tabs-bar {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid rgba(160, 130, 255, 0.10);
            margin-bottom: 22px;
            flex-wrap: wrap;
        }
        body:not(.dark) .tabs-bar {
            border-bottom-color: rgba(100, 70, 200, 0.10);
        }
        .tab-btn {
            padding: 8px 22px;
            border: none;
            background: transparent;
            font-weight: 600;
            cursor: pointer;
            border-radius: 40px 40px 0 0;
            transition: 0.2s;
            color: #b8abdd;
            font-size: 0.9rem;
        }
        body:not(.dark) .tab-btn {
            color: #5a4a7a;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            box-shadow: 0 4px 20px rgba(120, 80, 240, 0.25);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0.4;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .exp-item {
            margin-bottom: 22px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(160, 130, 255, 0.06);
        }
        body:not(.dark) .exp-item {
            border-bottom-color: rgba(100, 70, 200, 0.06);
        }
        .exp-item:last-child {
            border-bottom: none;
        }
        .exp-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.05rem;
            color: #d4c8ff;
        }
        body:not(.dark) .exp-header {
            color: #2d1b69;
        }
        .exp-sub {
            font-weight: 400;
            color: #b8abdd;
            font-size: 0.85rem;
        }
        body:not(.dark) .exp-sub {
            color: #7a6a9a;
        }
        .exp-desc {
            padding-left: 4px;
            list-style: none;
            margin-top: 8px;
        }
        .exp-desc li {
            margin-left: 20px;
            margin-bottom: 6px;
            position: relative;
            color: #cfc5e8;
        }
        body:not(.dark) .exp-desc li {
            color: #3a2a5a;
        }
        .exp-desc li::before {
            content: "✦";
            color: #a78bfa;
            position: absolute;
            left: -18px;
            font-size: 0.7rem;
            top: 2px;
        }
        body:not(.dark) .exp-desc li::before {
            color: #6d28d9;
        }

        /* ===== 技能 ===== */
        .skill-tag {
            display: inline-block;
            background: rgba(160, 130, 255, 0.08);
            border: 1px solid rgba(160, 130, 255, 0.08);
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            margin: 4px 8px 4px 0;
            font-weight: 500;
            color: #c8b6ff;
            backdrop-filter: blur(4px);
        }
        body:not(.dark) .skill-tag {
            background: rgba(100, 70, 200, 0.04);
            border-color: rgba(100, 70, 200, 0.06);
            color: #4a3a6a;
        }
        .skill-group {
            margin-bottom: 12px;
        }
        .skill-group strong {
            display: inline-block;
            min-width: 70px;
            font-weight: 600;
            color: #d4c8ff;
        }
        body:not(.dark) .skill-group strong {
            color: #2d1b69;
        }

        /* ===== 页脚 ===== */
        footer {
            margin-top: 36px;
            padding-top: 18px;
            border-top: 1px solid rgba(160, 130, 255, 0.06);
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.5;
            color: #b8abdd;
        }
        body:not(.dark) footer {
            color: #5a4a7a;
            border-top-color: rgba(100, 70, 200, 0.06);
        }

        /* ===== 返回顶部 ===== */
        .back-top {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 40px;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(120, 80, 240, 0.35);
            opacity: 0;
            transition: 0.25s;
            pointer-events: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .back-top.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .back-top:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(120, 80, 240, 0.45);
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
            }
        }

        /* ===== 打印样式 ===== */
        @media print {
            body {
                background: white !important;
                color: #1e1a2e !important;
                padding: 0 !important;
            }
            body::before,
            body::after {
                display: none !important;
            }
            .container {
                background: white !important;
                backdrop-filter: none !important;
                box-shadow: none !important;
                border: 1px solid #ddd !important;
                padding: 20px !important;
            }
            .nav-actions,
            .icon-btn,
            .back-top {
                display: none !important;
            }
            .card:hover {
                transform: none !important;
                box-shadow: none !important;
            }
            .hero-stats {
                background: #f4f0ff !important;
                border: 1px solid #ddd !important;
            }
            .tab-btn {
                background: #f4f0ff !important;
                color: #1e1a2e !important;
            }
            .tab-btn.active {
                background: #6d28d9 !important;
                color: white !important;
            }
            .card {
                background: #faf8ff !important;
                border-color: #e8e0ff !important;
            }
            .badge {
                background: #f4f0ff !important;
                border-color: #ddd !important;
                color: #2d1b69 !important;
            }
            .badge.primary {
                background: #6d28d9 !important;
                color: white !important;
            }
            .hero-text h1 {
                -webkit-text-fill-color: #2d1b69 !important;
                background: none !important;
                color: #2d1b69 !important;
            }
            .nav-name {
                -webkit-text-fill-color: #6d28d9 !important;
                background: none !important;
                color: #6d28d9 !important;
            }
            .stat-num {
                color: #6d28d9 !important;
                text-shadow: none !important;
            }
            .exp-desc li::before {
                color: #6d28d9 !important;
            }
            .contact-row a,
            .contact-row span {
                color: #6d28d9 !important;
            }
            .section-title {
                color: #2d1b69 !important;
            }
            .exp-header {
                color: #2d1b69 !important;
            }
            .exp-sub {
                color: #5a4a7a !important;
            }
            .exp-desc li {
                color: #3a2a5a !important;
            }
            .skill-group strong {
                color: #2d1b69 !important;
            }
            .skill-tag {
                color: #4a3a6a !important;
                background: #f4f0ff !important;
                border-color: #ddd !important;
            }
            footer {
                color: #5a4a7a !important;
                border-top-color: #ddd !important;
            }
            .hero-text p {
                color: #3a2a5a !important;
            }
            .hero-text .subhead {
                color: #5a4a7a !important;
            }
            .stat-label {
                color: #5a4a7a !important;
            }
            .nav-links a {
                color: #4a3a6a !important;
            }
            .highlight-card {
                border-left-color: #6d28d9 !important;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- ===== 导航 ===== -->
        <nav>
            <div class="nav-left">
                <span class="nav-name">✦ 张宇航</span>
                <div class="nav-links">
                    <a href="#hero">摘要</a>
                    <a href="#highlights">亮点</a>
                    <a href="#exp">经历</a>
                    <a href="#projects">项目</a>
                    <a href="#skills">技能</a>
                    <a href="#edu">教育</a>
                </div>
            </div>
            <div class="nav-actions">
                <button class="icon-btn" id="themeToggle" aria-label="切换深浅色">🌙</button>
                <button class="icon-btn" id="printBtn" aria-label="打印">🖨️</button>
            </div>
        </nav>

        <!-- ===== 挂载点 ===== -->
        <div id="resume-root"></div>

        <!-- ===== 返回顶部 ===== -->
        <button class="back-top" id="backTop" aria-label="返回顶部">↑</button>
    </div>

    <script>
        (function() {
            // =============================================
            //  简历数据（完整丰富版）
            // =============================================
            const resume = {
                name: '张宇航',
                title: '数据分析方向 · 准大一 (2026级)',
                contact: {
                    phone: '15861936143',
                    email: '3628690779@qq.com',

                },

                    });

                        if (e.key === 'ArrowRight') {
                            e.preventDefault();
                            tabs[(idx + 1) % tabs.length]?.focus();
                            tabs[(idx + 1) % tabs.length]?.click();
                        }
                        if (e.key === 'ArrowLeft') {
